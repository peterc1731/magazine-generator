name: Deploy

# Deploys to Google Cloud Run (deploy/terraform). One-time setup first:
# deploy/bootstrap.sh, then the repository variables it prints — see
# README.md "Deploying to Google Cloud Run".

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false # never interrupt a half-finished apply/rollout

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    # Skip (rather than fail) until deploy/bootstrap.sh has been run and its
    # repository variables set.
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for Workload Identity Federation
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_IN_AUTOMATION: "true"
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false # keep `terraform output -raw` clean

      - name: Terraform apply (infrastructure)
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform apply -input=false -auto-approve

      - name: Read deploy targets
        id: tf
        run: |
          {
            echo "image=$(terraform output -raw image_repository)/magazine-generator:${GITHUB_SHA}"
            echo "web=$(terraform output -raw web_service_name)"
            echo "pipeline=$(terraform output -raw pipeline_job_name)"
            echo "migrate=$(terraform output -raw migrate_job_name)"
            echo "url=$(terraform output -raw web_url)"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        working-directory: .
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "${{ steps.tf.outputs.image }}" .
          docker push "${{ steps.tf.outputs.image }}"

      # Migrate before rolling out, so new code never runs against an old
      # schema. --wait fails this step (and stops the deploy) if it fails.
      - name: Run database migrations
        run: |
          gcloud run jobs update "${{ steps.tf.outputs.migrate }}" \
            --region "$REGION" --image "${{ steps.tf.outputs.image }}" --quiet
          gcloud run jobs execute "${{ steps.tf.outputs.migrate }}" \
            --region "$REGION" --wait

      - name: Roll out pipeline job
        run: |
          gcloud run jobs update "${{ steps.tf.outputs.pipeline }}" \
            --region "$REGION" --image "${{ steps.tf.outputs.image }}" --quiet

      - name: Roll out web service
        run: |
          gcloud run services update "${{ steps.tf.outputs.web }}" \
            --region "$REGION" --image "${{ steps.tf.outputs.image }}" --quiet

      - name: Smoke test
        run: curl -fsS --retry 5 --retry-all-errors "${{ steps.tf.outputs.url }}/health"
