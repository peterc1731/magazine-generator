[project]
name = "magazine-generator"
version = "0.1.0"
description = "Weekly ePub magazine generator with an OPDS server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.54",
    "alembic>=1.20.0",
    "httpx>=0.28.1",
    "trafilatura>=2.2.0",
    "ebooklib>=0.20",
    "feedparser>=6.0.14",
    "beautifulsoup4>=4.15.0",
    "anthropic>=1.7.0",
    "pillow>=12.3.0",
    "apscheduler>=3.11.3",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.23.1",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 (no function calls in argument defaults) is a false positive for
# FastAPI's Depends(...) pattern, which is the framework's own idiom.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "connectors", "pipeline"]
